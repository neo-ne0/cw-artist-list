        * {

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 40px;
            background: #DEB887;
            color: #3E2A1F;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            font-family: 'Georgia', 'Times New Roman', cursive;
            font-style: italic;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: #D2B48C;
            transform: scale(1.02);
        }

        .gallery {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .gallery img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 600px) {
            .gallery {
                gap: 20px;
            }
        }
    </style>
